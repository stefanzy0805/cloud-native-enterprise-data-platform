<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senior DE 面试查漏补缺单</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&display=swap');
  :root{--bg:#0a0e1a;--surface:#111827;--border:#1e293b;--accent1:#00d4ff;--accent2:#7c3aed;--accent3:#10b981;--accent4:#f59e0b;--accent5:#ef4444;--text:#e2e8f0;--muted:#64748b}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans SC',sans-serif;min-height:100vh;padding:40px 20px;background-image:radial-gradient(ellipse at 20% 20%,rgba(124,58,237,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(0,212,255,.06) 0%,transparent 50%)}
  header{text-align:center;margin-bottom:48px}
  header h1{font-family:'JetBrains Mono',monospace;font-size:clamp(1.8rem,4vw,3rem);font-weight:700;letter-spacing:-1px;background:linear-gradient(135deg,var(--accent1),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  header p{color:var(--muted);margin-top:8px;font-family:'JetBrains Mono',monospace;font-size:.85rem;letter-spacing:2px}
  .progress-bar{width:300px;height:4px;background:var(--border);border-radius:2px;margin:16px auto 0;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent1),var(--accent2));border-radius:2px;transition:width .5s ease;width:0%}
  .progress-text{text-align:center;font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted);margin-top:6px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:24px;max-width:1400px;margin:0 auto}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:transform .2s ease,border-color .2s ease}
  .card:hover{transform:translateY(-2px);border-color:var(--accent2)}
  .card-header{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
  .card-icon{font-size:1.4rem;width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .card-title{font-family:'JetBrains Mono',monospace;font-size:.95rem;font-weight:700;letter-spacing:.5px}
  .card-count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted)}
  .card-body{padding:16px 20px}
  .section-label{font-size:.65rem;font-family:'JetBrains Mono',monospace;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;margin-top:14px}
  .section-label:first-child{margin-top:0}
  .item{display:flex;align-items:flex-start;gap:10px;padding:6px 0;cursor:pointer;border-radius:4px;transition:background .15s;user-select:none}
  .item:hover{background:rgba(255,255,255,.03);padding-left:4px}
  .checkbox{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:3px;flex-shrink:0;margin-top:2px;transition:all .15s ease;display:flex;align-items:center;justify-content:center}
  .item.checked .checkbox{background:var(--accent3);border-color:var(--accent3)}
  .item.checked .checkbox::after{content:'✓';font-size:10px;color:#000;font-weight:700}
  .item.checked .item-text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted)}
  .item-text{font-size:.85rem;line-height:1.4;color:var(--text);transition:color .15s}
  .tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:.65rem;font-family:'JetBrains Mono',monospace;margin-left:6px;vertical-align:middle}
  .tag-hot{background:rgba(239,68,68,.2);color:#ef4444}
  .tag-med{background:rgba(245,158,11,.2);color:#f59e0b}
  .c1 .card-icon{background:rgba(0,212,255,.1)}.c1 .card-title{color:var(--accent1)}
  .c2 .card-icon{background:rgba(245,158,11,.1)}.c2 .card-title{color:var(--accent4)}
  .c3 .card-icon{background:rgba(16,185,129,.1)}.c3 .card-title{color:var(--accent3)}
  .c4 .card-icon{background:rgba(124,58,237,.1)}.c4 .card-title{color:#a78bfa}
  .c5 .card-icon{background:rgba(239,68,68,.1)}.c5 .card-title{color:var(--accent5)}
  .c6 .card-icon{background:rgba(249,115,22,.1)}.c6 .card-title{color:#fb923c}
  .c7 .card-icon{background:rgba(236,72,153,.1)}.c7 .card-title{color:#f472b6}
  .reset-btn{display:block;margin:32px auto 0;padding:10px 28px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.8rem;cursor:pointer;transition:all .2s;letter-spacing:1px}
  .reset-btn:hover{border-color:var(--accent1);color:var(--accent1)}
</style>
</head>
<body>
<header>
  <h1>Senior DE · 查漏补缺单</h1>
  <p>INTERVIEW PREPARATION CHECKLIST</p>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText">0 / 0 completed</div>
</header>
<div class="grid" id="grid"></div>
<button class="reset-btn" onclick="resetAll()">↺ 重置进度</button>
<script>
const sections=[
  {id:'sql',color:'c1',icon:'🗃️',title:'SQL',groups:[
    {label:'窗口函数',items:[
      ['ROW_NUMBER / RANK / DENSE_RANK 区别及场景','hot'],

      ['ROWS BETWEEN / RANGE BETWEEN 滑动窗口','med'],
      ['FIRST_VALUE / LAST_VALUE / NTH_VALUE',''],
      ['NTILE 分桶',''],
    ]},
    {label:'聚合 & 分组',items:[
      ['GROUP BY ROLLUP / CUBE / GROUPING SETS','med'],
      ['HAVING vs WHERE 执行顺序','hot'],
      ['FILTER (WHERE ...) 条件聚合',''],
      ['DISTINCT vs GROUP BY 性能差异',''],
    ]},
    {label:'Join & 子查询',items:[
      ['各类 JOIN 语义 & NULL 行为','hot'],
      ['LATERAL JOIN / CROSS APPLY','med'],
      ['EXISTS vs IN vs JOIN 性能','hot'],
      ['CTE (WITH) 递归 CTE','med'],
      ['Semi/Anti Join 优化',''],
    ]},
    {label:'性能调优',items:[
      ['执行计划 EXPLAIN / EXPLAIN ANALYZE','hot'],
      ['索引：B-Tree / Hash / Bitmap / Composite','hot'],
      ['分区表 & 分区裁剪','hot'],
      ['Stats 更新 & Cardinality 估算','med'],
      ['物化视图 vs 普通视图','med'],
    ]},
    {label:'数据库特性',items:[
      ['事务 ACID & 隔离级别','hot'],
      ['MVCC 多版本并发控制','med'],
      ['死锁检测 & 预防',''],
      ['Vacuum / Analyze (Postgres)',''],
    ]},
  ]},
  {id:'python',color:'c2',icon:'🐍',title:'Python',groups:[
    {label:'语言核心',items:[
      ['GIL 原理 & 多线程 vs 多进程','hot'],
      ['Generator / Iterator 协议','hot'],
      ['装饰器 & functools.wraps','hot'],
      ['Context Manager __enter__/__exit__','med'],
      ['Descriptor Protocol __get__/__set__',''],
      ['元类 Metaclass',''],
      ['async/await & asyncio 事件循环','hot'],
    ]},
    {label:'数据处理',items:[
      ['Pandas: groupby / merge / pivot_table','hot'],
      ['Pandas: apply vs vectorize 性能','hot'],
      ['Pandas: memory_usage & 类型降级优化','med'],
      ['NumPy: broadcasting 规则','med'],
      ['Polars vs Pandas 对比','med'],
      ['Arrow / PyArrow 内存格式','hot'],
    ]},
    {label:'工程实践',items:[
      ['单元测试 pytest / mock / fixture','hot'],
      ['类型注解 typing & mypy','med'],
      ['logging 模块最佳实践',''],
      ['Profile: cProfile / line_profiler','med'],
      ['内存泄漏排查 tracemalloc',''],
      ['packaging: pyproject.toml / poetry',''],
    ]},
  ]},
  {id:'spark',color:'c3',icon:'⚡',title:'Apache Spark',groups:[
    {label:'架构原理',items:[
      ['Driver / Executor / Task / Stage 关系','hot'],
      ['DAG Scheduler & Task Scheduler','hot'],
      ['宽依赖 vs 窄依赖 & Shuffle','hot'],
      ['Catalyst Optimizer & Physical Plan','hot'],
      ['Tungsten 内存管理 & Code Generation','med'],
    ]},
    {label:'DataFrame & SQL',items:[
      ['Lazy Evaluation & Action vs Transformation','hot'],
      ['Cache / Persist 存储级别选择','hot'],
      ['Broadcast Join vs Sort-Merge Join','hot'],
      ['Bucketing 减少 Shuffle','med'],
      ['Skew Join 倾斜处理（salting）','hot'],
      ['Dynamic Partition Pruning','med'],
      ['AQE 自适应查询执行','hot'],
    ]},
    {label:'调优 & 踩坑',items:[
      ['Shuffle Partition 数量调整','hot'],
      ['spark.sql.adaptive.* 配置','hot'],
      ['OOM 排查：Executor vs Driver','hot'],
      ['Speculative Execution','med'],
      ['小文件合并策略','med'],
      ['RDD vs DataFrame vs Dataset 对比','med'],
    ]},
    {label:'Structured Streaming',items:[
      ['Micro-batch vs Continuous Processing','hot'],
      ['Watermark & 迟到数据处理','hot'],
      ['Trigger 类型：Once / ProcessingTime / Available','med'],
      ['Checkpointing & Exactly-once','hot'],
      ['Stateful Aggregation & State Store','med'],
    ]},
  ]},
  {id:'pipeline',color:'c4',icon:'🔄',title:'数据管道 & 调度',groups:[
    {label:'Airflow',items:[
      ['DAG / Operator / Task / XCom 概念','hot'],
      ['Executor 类型：Local / Celery / K8s','hot'],
      ['Dynamic DAG 生成','med'],
      ['Sensor & Deferrable Operator','med'],
      ['SLA / Callback / Retry 策略',''],
      ['Airflow 2.x TaskFlow API','med'],
    ]},
    {label:'数据质量 & 测试',items:[
      ['Great Expectations / dbt tests','hot'],
      ['幂等性设计（Idempotency）','hot'],
      ['数据血缘 Lineage 追踪','hot'],
      ['Schema Evolution 策略','hot'],
      ['Backfill 策略与风险','med'],
    ]},
    {label:'dbt',items:[
      ['model 依赖 & ref() 函数','hot'],
      ['Incremental 模型策略','hot'],
      ['Source freshness & Tests','med'],
      ['Macro & Jinja 模板','med'],
      ['Snapshots (SCD Type 2)','hot'],
    ]},
  ]},
  {id:'infra',color:'c5',icon:'☁️',title:'云 & 基础设施',groups:[
    {label:'云数仓',items:[
      ['Snowflake: Virtual Warehouse / Clustering Key','hot'],
      ['Snowflake: Time Travel & Zero-Copy Clone','med'],
      ['BigQuery: Slot / Reservation / BI Engine','hot'],
      ['BigQuery: Partitioning & Clustering 选择','hot'],
      ['Redshift: Distribution Style / Sort Key','med'],
      ['Databricks: Photon / Delta Engine','med'],
    ]},
    {label:'容器 & 编排',items:[
      ['Docker: 多阶段构建 & Layer 缓存','med'],
      ['K8s: Pod / Deployment / Service / PVC','med'],
      ['K8s: Resource Request vs Limit','med'],
      ['Helm Chart 基础',''],
    ]},
    {label:'IaC & CI/CD',items:[
      ['Terraform: state / plan / apply','med'],
      ['GitHub Actions / GitLab CI 基础','hot'],
      ['环境隔离策略 dev/staging/prod','hot'],
    ]},
  ]},
  {id:'storage',color:'c6',icon:'📦',title:'存储 & 格式',groups:[
    {label:'文件格式',items:[
      ['Parquet vs ORC vs Avro 对比','hot'],
      ['Parquet: Row Group / Column Chunk / Page','hot'],
      ['Parquet: Dictionary Encoding / RLE','med'],
      ['Delta Lake vs Iceberg vs Hudi 对比','hot'],
      ['ACID on Data Lake 实现原理','hot'],
      ['Z-Ordering / Liquid Clustering','med'],
    ]},
    {label:'Kafka & 流',items:[
      ['Topic / Partition / Consumer Group','hot'],
      ['Offset 管理 & At-least-once / Exactly-once','hot'],
      ['Replication Factor & ISR','med'],
      ['Compaction Log','med'],
      ['Consumer Lag 监控','hot'],
      ['Kafka Connect & Schema Registry','med'],
    ]},
    {label:'NoSQL & 缓存',items:[
      ['CAP / PACELC 定理','med'],
      ['Redis: 数据结构 & 持久化 RDB/AOF','med'],
      ['Cassandra: Partition Key 设计',''],
      ['DynamoDB: GSI / LSI / Capacity Modes','med'],
    ]},
  ]},

  {id:'distributed',color:'c5',icon:'🌐',title:'Distributed Systems',groups:[
    {label:'核心理论',items:[
      ['CAP Theorem 实际应用场景','hot'],
      ['Consistency Model: Strong vs Eventual','hot'],
      ['Leader Election 基本原理','med'],
      ['Network Partition 影响','hot'],
      ['Partial Failure 处理','hot'],
    ]},
    {label:'工程问题',items:[
      ['Idempotent Pipeline 设计','hot'],
      ['Retry & Duplicate Data 问题','hot'],
      ['Backpressure 机制','med'],
      ['Exactly-once 实现难点','hot'],
      ['分布式事务 vs 最终一致性','med'],
    ]}
  ]},
  {id:'reliability',color:'c6',icon:'🩺',title:'Data Reliability',groups:[
    {label:'Data Quality',items:[
      ['Data Contract 设计','hot'],
      ['Freshness / Completeness 指标','hot'],
      ['Schema Breaking Change 处理','hot'],
      ['Upstream Failure 防护','med'],
    ]},
    {label:'Observability',items:[
      ['Data Lineage 体系','hot'],
      ['SLA vs SLO vs SLI','hot'],
      ['Monitoring Metrics 设计','med'],
      ['Alert Fatigue 避免策略',''],
    ]},
    {label:'Incident Handling',items:[
      ['Pipeline Failure RCA','hot'],
      ['Rollback & Replay Strategy','hot'],
      ['Backfill 安全执行','hot'],
      ['On-call Runbook','med'],
    ]}
  ]},

  {id:'design',color:'c7',icon:'🏗️',title:'系统设计 & 架构',groups:[
    {label:'数仓建模',items:[
      ['Kimball: 星型 / 雪花型 / Galaxy 模式','hot'],
      ['SCD Type 1/2/3/4/6','hot'],
      ['Data Vault 2.0 Hub/Link/Satellite','med'],
      ['One Big Table (OBT) vs 规范化','med'],
      ['Lakehouse 架构设计','hot'],
    ]},
    {label:'经典系统设计',items:[
      ['设计日志聚合系统（Clickstream）','hot'],
      ['设计实时 Dashboard（Lambda/Kappa）','hot'],
      ['设计 Feature Store','med'],
      ['设计 ETL 监控告警系统','hot'],
      ['设计 Multi-tenant 数仓隔离','med'],
    ]},
    {label:'行为面试',items:[
      ['STAR 法则讲述复杂项目','hot'],
      ['解释技术权衡决策过程','hot'],
      ['跨团队协作冲突处理','med'],
      ['系统上线失败的复盘','med'],
      ['如何 mentor 初级工程师',''],
    ]},
  ]},
];

function getState(){return JSON.parse(localStorage.getItem('de_checklist')||'{}')}
function saveState(s){localStorage.setItem('de_checklist',JSON.stringify(s))}

function renderSections(){
  const grid=document.getElementById('grid');
  const state=getState();
  grid.innerHTML=sections.map(s=>{
    const allItems=s.groups.flatMap(g=>g.items);
    const checkedCount=allItems.filter(([t])=>state[s.id+'::'+t]).length;
    const groupsHtml=s.groups.map(g=>`
      <div class="section-label">${g.label}</div>
      ${g.items.map(([text,tag])=>{
        const key=s.id+'::'+text;
        const ck=state[key]?'checked':'';
        const tagHtml=tag==='hot'?'<span class="tag tag-hot">高频</span>':tag==='med'?'<span class="tag tag-med">重要</span>':'';
        return `<div class="item ${ck}" data-key="${key}" onclick="toggle(this)">
          <div class="checkbox"></div>
          <div class="item-text">${text}${tagHtml}</div>
        </div>`;
      }).join('')}
    `).join('');
    return `<div class="card ${s.color}">
      <div class="card-header">
        <div class="card-icon">${s.icon}</div>
        <div class="card-title">${s.title}</div>
        <div class="card-count" data-section="${s.id}">${checkedCount}/${allItems.length}</div>
      </div>
      <div class="card-body">${groupsHtml}</div>
    </div>`;
  }).join('');
  updateProgress();
}

function toggle(el){
  const state=getState();
  const key=el.dataset.key;
  if(state[key]){delete state[key];el.classList.remove('checked');}
  else{state[key]=true;el.classList.add('checked');}
  saveState(state);
  updateProgress();
  const sectionId=key.split('::')[0];
  const s=sections.find(x=>x.id===sectionId);
  const allItems=s.groups.flatMap(g=>g.items);
  const done=allItems.filter(([t])=>state[sectionId+'::'+t]).length;
  const cnt=document.querySelector(`.card-count[data-section="${sectionId}"]`);
  if(cnt)cnt.textContent=done+'/'+allItems.length;
}

function updateProgress(){
  const state=getState();
  const total=sections.flatMap(s=>s.groups.flatMap(g=>g.items)).length;
  const done=Object.keys(state).length;
  document.getElementById('progressFill').style.width=(done/total*100)+'%';
  document.getElementById('progressText').textContent=done+' / '+total+' completed';
}

function resetAll(){
  if(confirm('确定重置所有进度吗？')){localStorage.removeItem('de_checklist');renderSections();}}

renderSections();
</script>
</body>
</html>
