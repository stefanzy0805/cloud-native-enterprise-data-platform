services:
  # ===========================================
  # Dev Container - 开发容器
  # 用于：写代码、跑 Spark、跑 ETL / DQ
  # ===========================================
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: data-platform-dev
    volumes:
      - .:/workspace:cached
      # Persist bash history
      - dev-bash-history:/home/vscode/.bash_history
      # Persist pip cache
      - dev-pip-cache:/home/vscode/.cache/pip
    environment:
      - SPARK_HOME=/opt/spark
      - JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
      # Postgres connection
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=dataplatform
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=dataplatform
      # Spark configuration
      - SPARK_DRIVER_MEMORY=2g
      - SPARK_EXECUTOR_MEMORY=2g
    ports:
      - "4040:4040"   # Spark UI
      - "8080:8080"   # Spark Master UI
      - "8888:8888"   # Jupyter Lab
    depends_on:
      - postgres
    networks:
      - dataplatform-network
    # Keep container running
    command: sleep infinity

  # ===========================================
  # Service Containers - 服务容器
  # 用于模拟真实外部依赖
  # ===========================================

  # PostgreSQL - 关系型数据库
  postgres:
    image: postgres:15-alpine
    container_name: data-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dataplatform
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: dataplatform
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - dataplatform-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataplatform -d dataplatform"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================
  # 可选服务 - 取消注释以启用
  # ===========================================

  # Kafka - 消息队列（用于流处理）
  # kafka:
  #   image: confluentinc/cp-kafka:7.5.0
  #   container_name: data-platform-kafka
  #   environment:
  #     KAFKA_BROKER_ID: 1
  #     KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #   ports:
  #     - "9092:9092"
  #   depends_on:
  #     - zookeeper
  #   networks:
  #     - dataplatform-network

  # zookeeper:
  #   image: confluentinc/cp-zookeeper:7.5.0
  #   container_name: data-platform-zookeeper
  #   environment:
  #     ZOOKEEPER_CLIENT_PORT: 2181
  #   networks:
  #     - dataplatform-network

  # Redis - 缓存（用于限流、会话等）
  # redis:
  #   image: redis:7-alpine
  #   container_name: data-platform-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - dataplatform-network

  # MinIO - S3兼容对象存储（模拟云存储）
  # minio:
  #   image: minio/minio:latest
  #   container_name: data-platform-minio
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio-data:/data
  #   networks:
  #     - dataplatform-network

networks:
  dataplatform-network:
    driver: bridge

volumes:
  postgres-data:
  dev-bash-history:
  dev-pip-cache:
